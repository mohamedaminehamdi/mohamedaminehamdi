name: Trophies and activity graph

on:
  schedule:
    - cron: "30 4 * * *"   # daily at 04:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/trophies-activity.yml", "scripts/build_activity.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activity graph
        run: python3 scripts/build_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trophies (light)
        uses: ryo-ma/github-profile-trophy@e3c89df995e92e67cdd4b2acaab9d974583dc1f7 # master
        with:
          username: ${{ github.repository_owner }}
          output_path: assets/trophies-light.svg
          theme: flat
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Trophies (dark)
        uses: ryo-ma/github-profile-trophy@e3c89df995e92e67cdd4b2acaab9d974583dc1f7 # master
        with:
          username: ${{ github.repository_owner }}
          output_path: assets/trophies-dark.svg
          theme: darkhub
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        if: ${{ !cancelled() }}   # keep whatever succeeded even if one step failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-*.svg assets/trophies-*.svg
          git diff --cached --quiet || (git commit -m "Update trophies and activity graph" && git pull --rebase && git push)
